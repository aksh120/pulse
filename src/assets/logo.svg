  <!-- PULSE Geometric Signal Mark -->
  <g class="pulse-mark">
    <rect x="2" y="10" width="4" height="12" rx="2" fill="#635BFF"/>
    <rect x="8.5" y="4" width="4" height="24" rx="2" fill="#635BFF"/>
    <rect x="15" y="9" width="4" height="14" rx="2" fill="#635BFF"/>
